---
# Example: 3 control-plane nodes, 3 workers, 1 dedicated GitLab runner node.
# Node types are pure inventory: a new node group = child of rke2_agents
# with its own labels/taints in group_vars. Playbooks never change.
rke2_cluster:
  children:
    rke2_servers:
      hosts:
        master-01:
          ansible_host: <MASTER_01_IP>
        master-02:
          ansible_host: <MASTER_02_IP>
        master-03:
          ansible_host: <MASTER_03_IP>

    rke2_agents:
      children:
        workers:
          hosts:
            worker-01:
              ansible_host: <WORKER_01_IP>
            worker-02:
              ansible_host: <WORKER_02_IP>
            worker-03:
              ansible_host: <WORKER_03_IP>

        runners:
          hosts:
            runner-01:
              ansible_host: <RUNNER_01_IP>
