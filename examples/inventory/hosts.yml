---
# HA cluster: 3 control-plane nodes, 3 workers, 1 dedicated GitLab runner.
#
# The contract:
#   rke2_servers — control-plane. The FIRST host bootstraps the cluster and
#                  is the source of the join token / registration URL for
#                  everyone else. Order matters: keep the bootstrap node
#                  first (or pin rke2_first_server: true on it).
#   rke2_agents  — workers. A node CLASS is a child group with its own
#                  group_vars (labels/taints/roles) — see runners below.
#                  Playbooks never change when you add a class.
#
# Server plays run serial: 1 (etcd quorum); agents converge in parallel.
# Scale-out = add a host here and re-run deploy; nothing else changes.
rke2_cluster:
  children:
    rke2_servers:
      hosts:
        master-01:                      # bootstrap node — first in the group
          ansible_host: <MASTER_01_IP>
        master-02:
          ansible_host: <MASTER_02_IP>
        master-03:
          ansible_host: <MASTER_03_IP>

    rke2_agents:
      children:
        workers:
          hosts:
            worker-01:
              ansible_host: <WORKER_01_IP>
            worker-02:
              ansible_host: <WORKER_02_IP>
            worker-03:
              ansible_host: <WORKER_03_IP>

        # dedicated node class: labels/taints/roles in group_vars/runners.yml
        runners:
          hosts:
            runner-01:
              ansible_host: <RUNNER_01_IP>
