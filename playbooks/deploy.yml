---
# Deploy an RKE2 cluster defined entirely by inventory.
#
# Inventory contract:
#   rke2_servers — control-plane nodes; the FIRST host bootstraps the cluster
#   rke2_agents  — worker nodes; labels/taints via group/host vars
#
# Usage:
#   ansible-playbook maksimrudakov.rke2.deploy -i inventory/<env>/
#
# Re-running is safe: installed nodes converge config only.

- name: Bootstrap first RKE2 server
  hosts: rke2_servers[0]
  become: true
  vars:
    rke2_role: server
  roles:
    - maksimrudakov.rke2.node

- name: Join additional RKE2 servers
  hosts: rke2_servers[1:]
  become: true
  serial: 1  # etcd quorum: never converge control-plane nodes in parallel
  any_errors_fatal: true
  vars:
    rke2_role: server
  roles:
    - maksimrudakov.rke2.node

- name: Join RKE2 agents
  hosts: rke2_agents
  become: true
  vars:
    rke2_role: agent
  roles:
    - maksimrudakov.rke2.node

- name: Show cluster state
  hosts: rke2_servers[0]
  become: true
  gather_facts: false
  vars:
    rke2_kubectl: /var/lib/rancher/rke2/bin/kubectl
    rke2_kubeconfig: /etc/rancher/rke2/rke2.yaml
  tasks:
    - name: Get cluster nodes
      ansible.builtin.command:
        cmd: "{{ rke2_kubectl }} --kubeconfig {{ rke2_kubeconfig }} get nodes -o wide"
      register: rke2_cluster_state
      changed_when: false

    - name: Cluster state
      ansible.builtin.debug:
        msg: "{{ rke2_cluster_state.stdout_lines }}"
