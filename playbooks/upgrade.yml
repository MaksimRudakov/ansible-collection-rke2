---
# Rolling upgrade of an existing cluster to a new rke2_version.
#
# Flow per node: cordon → drain → converge (reinstall + restart) →
# wait Ready → uncordon. Servers first (serial 1), then agents (serial 1).
#
# Usage:
#   ansible-playbook maksimrudakov.rke2.upgrade -i inventory/<env>/ \
#     -e rke2_version=<VERSION>
#
# Downgrade is refused by the role (rke2_allow_downgrade=false).

- name: Preflight — current cluster state
  hosts: rke2_servers[0]
  become: true
  gather_facts: false
  vars:
    rke2_kubectl: /var/lib/rancher/rke2/bin/kubectl
    rke2_kubeconfig: /etc/rancher/rke2/rke2.yaml
  tasks:
    - name: Get cluster nodes
      ansible.builtin.command:
        cmd: "{{ rke2_kubectl }} --kubeconfig {{ rke2_kubeconfig }} get nodes -o wide"
      register: rke2_cluster_state
      changed_when: false
      retries: 10
      delay: 15
      until: rke2_cluster_state.rc == 0

    - name: Cluster state before upgrade
      ansible.builtin.debug:
        msg: "{{ rke2_cluster_state.stdout_lines }}"

- name: Upgrade RKE2 servers (rolling)
  hosts: rke2_servers
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    rke2_role: server
    # kubectl runs on another server while this one is restarting
    rke2_kubectl_delegate: >-
      {{ (groups['rke2_servers'] | difference([inventory_hostname]) | first)
         | default(inventory_hostname) }}
  pre_tasks:
    - name: Cordon node
      ansible.builtin.include_role:
        name: maksimrudakov.rke2.node
        tasks_from: cordon

    - name: Drain node
      ansible.builtin.include_role:
        name: maksimrudakov.rke2.node
        tasks_from: drain
  roles:
    - maksimrudakov.rke2.node
  post_tasks:
    - name: Wait for local K8s API
      ansible.builtin.wait_for:
        port: 6443
        timeout: 300

    - name: Wait for node Ready
      ansible.builtin.include_role:
        name: maksimrudakov.rke2.node
        tasks_from: wait_ready

    - name: Uncordon node
      ansible.builtin.include_role:
        name: maksimrudakov.rke2.node
        tasks_from: uncordon

    - name: Pause for etcd stabilization
      ansible.builtin.pause:
        seconds: "{{ rke2_upgrade_pause_servers | default(60) }}"

- name: Upgrade RKE2 agents (rolling)
  hosts: rke2_agents
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    rke2_role: agent
  pre_tasks:
    - name: Cordon node
      ansible.builtin.include_role:
        name: maksimrudakov.rke2.node
        tasks_from: cordon

    - name: Drain node
      ansible.builtin.include_role:
        name: maksimrudakov.rke2.node
        tasks_from: drain
  roles:
    - maksimrudakov.rke2.node
  post_tasks:
    - name: Wait for node Ready
      ansible.builtin.include_role:
        name: maksimrudakov.rke2.node
        tasks_from: wait_ready

    - name: Uncordon node
      ansible.builtin.include_role:
        name: maksimrudakov.rke2.node
        tasks_from: uncordon

    - name: Pause before next agent
      ansible.builtin.pause:
        seconds: "{{ rke2_upgrade_pause_agents | default(30) }}"

- name: Post-upgrade verification
  hosts: rke2_servers[0]
  become: true
  gather_facts: false
  vars:
    rke2_kubectl: /var/lib/rancher/rke2/bin/kubectl
    rke2_kubeconfig: /etc/rancher/rke2/rke2.yaml
  tasks:
    - name: Get cluster nodes
      ansible.builtin.command:
        cmd: "{{ rke2_kubectl }} --kubeconfig {{ rke2_kubeconfig }} get nodes -o wide"
      register: rke2_cluster_state
      changed_when: false
      retries: 10
      delay: 15
      until: rke2_cluster_state.rc == 0

    - name: Cluster state after upgrade
      ansible.builtin.debug:
        msg: "{{ rke2_cluster_state.stdout_lines }}"
