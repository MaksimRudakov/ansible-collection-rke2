---
# Scoped to install.yml on purpose: the question under test is whether the
# role detects an existing RKE2 on RPM-based distros, not whether a cluster
# bootstraps inside a container
- name: Converge
  hosts: all
  vars:
    rke2_role: server
    rke2_first_server: true
    rke2_no_log: false
    rke2_sysctl_params: []  # not writable inside a container
  tasks:
    - name: Run install tasks
      ansible.builtin.include_role:
        name: maksimrudakov.rke2.node
        tasks_from: install

    # config.yml on an installed-but-not-started node: renders the files and
    # — the point here — writes the logind drop-in and restarts systemd-logind
    # (EL8 239 / EL9 252 / EL10 257: both reload branches)
    - name: Run config tasks with graceful shutdown enabled
      ansible.builtin.include_role:
        name: maksimrudakov.rke2.node
        tasks_from: config
      vars:
        rke2_shutdown_grace_period: 90
        rke2_shutdown_grace_period_critical_pods: 30

    - name: Report detection facts
      ansible.builtin.debug:
        msg:
          installed: "{{ rke2_installed }}"
          installed_version: "{{ rke2_installed_version }}"
          needs_upgrade: "{{ rke2_needs_upgrade }}"
