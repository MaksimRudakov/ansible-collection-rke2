---
- name: Verify
  hosts: rke2-server-1
  become: true
  vars:
    rke2_kubectl: /var/lib/rancher/rke2/bin/kubectl
    rke2_kubeconfig: /etc/rancher/rke2/rke2.yaml
  tasks:
    - name: Wait until both nodes are Ready
      ansible.builtin.command:
        cmd: "{{ rke2_kubectl }} --kubeconfig {{ rke2_kubeconfig }} get nodes --no-headers"
      register: rke2_nodes
      changed_when: false
      retries: 60
      delay: 15
      until: >-
        rke2_nodes.stdout_lines | length == 2 and
        (rke2_nodes.stdout_lines | select('search', ' Ready') | list | length) == 2

    - name: Count control-plane nodes
      ansible.builtin.command:
        cmd: >-
          {{ rke2_kubectl }} --kubeconfig {{ rke2_kubeconfig }}
          get nodes -l node-role.kubernetes.io/control-plane --no-headers
      register: rke2_cp_nodes
      changed_when: false

    - name: Assert exactly 1 control-plane node and 1 agent
      ansible.builtin.assert:
        that:
          - rke2_cp_nodes.stdout_lines | length == 1
          - rke2_nodes.stdout_lines | length == 2

    - name: Get runner node labels and taints
      ansible.builtin.command:
        cmd: >-
          {{ rke2_kubectl }} --kubeconfig {{ rke2_kubeconfig }}
          get node rke2-agent-1
          -o jsonpath={.metadata.labels}{.spec.taints}
      register: rke2_runner_node
      changed_when: false

    - name: Assert runner label and taint applied
      ansible.builtin.assert:
        that:
          - "'\"node-type\":\"gitlab-runner\"' in rke2_runner_node.stdout"
          - "'dedicated' in rke2_runner_node.stdout"
          - "'NoSchedule' in rke2_runner_node.stdout"

    - name: Assert the agent joined via the auto-derived registration URL
      ansible.builtin.command:
        cmd: grep -E "^server. https://rke2-server-1:9345" /etc/rancher/rke2/config.yaml
      delegate_to: rke2-agent-1
      changed_when: false

# Regression for the join_params bug (fixed in 1.2.0): standalone
# `tasks_from: config` used to render agent configs with an empty
# server:/token: because the derivation lived only in main.yml
- name: Regression — standalone config include keeps join parameters
  hosts: rke2-agent-1
  become: true
  vars:
    rke2_role: agent
  tasks:
    - name: Re-render config standalone (reconfig path)
      ansible.builtin.include_role:
        name: maksimrudakov.rke2.node
        tasks_from: config

    - name: Read rendered config.yaml
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/config.yaml
      register: rke2_verify_config
      no_log: true

    - name: Assert server and token survived the standalone re-render
      ansible.builtin.assert:
        that:
          - "'server: https://' in rke2_verify_config.content | b64decode"
          - "'token: ' in rke2_verify_config.content | b64decode"
        fail_msg: >-
          Standalone tasks_from=config rendered an incomplete agent config —
          join_params derivation regressed.

    - name: Check rke2-agent service state
      ansible.builtin.service_facts:

    - name: Assert rke2-agent stayed active
      ansible.builtin.assert:
        that: ansible_facts.services['rke2-agent.service'].state == 'running'
