---
- name: Converge
  hosts: all
  become: true
  vars:
    rke2_role: server
    rke2_first_server: true
    # exercises wait_server_url on the bootstrap path (ignored in config.yaml)
    rke2_server_url: https://127.0.0.1:9345
    rke2_no_log: false
    rke2_sysctl_params: []  # not writable inside a container
    # Config-only field (no flag exists): proves the drop-in is loaded by
    # kubelet and merged over 00-rke2-defaults.conf (which sets it to 0s)
    rke2_kubelet_config:
      imageMaximumGCAge: 168h
      evictionHard:
        memory.available: 123Mi
    rke2_manifests:
      - name: molecule-test-cm
        content:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: molecule-test
            namespace: kube-system
          data:
            source: rke2-manifests
  roles:
    - role: maksimrudakov.rke2.node

# Fleet on top of the converged cluster: exercises the fleet role in CI —
# helm install, charts, rollout wait; the idempotence phase re-runs it and
# checks the pinned-version upgrade guard (second run must be changed=0)
- name: Install Fleet standalone
  hosts: all
  become: true
  vars:
    fleet_version: "110.0.0+up0.16.0"  # pin = idempotent re-runs; bump deliberately
    fleet_gitrepo_enabled: false
  pre_tasks:
    - name: Wait for node Ready (fleet pods need a schedulable node)
      ansible.builtin.command:
        cmd: >-
          /var/lib/rancher/rke2/bin/kubectl
          --kubeconfig /etc/rancher/rke2/rke2.yaml
          wait --for=condition=Ready node --all --timeout=600s
      changed_when: false
  roles:
    - role: maksimrudakov.rke2.fleet
