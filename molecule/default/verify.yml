---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Get cluster nodes
      ansible.builtin.command:
        cmd: >-
          /var/lib/rancher/rke2/bin/kubectl
          --kubeconfig /etc/rancher/rke2/rke2.yaml
          get nodes --no-headers
      register: rke2_nodes
      changed_when: false
      retries: 30
      delay: 10
      until: "' Ready' in rke2_nodes.stdout"

    - name: Check config file permissions
      ansible.builtin.stat:
        path: /etc/rancher/rke2/config.yaml
      register: rke2_config_stat

    - name: Assert config.yaml is not world-readable
      ansible.builtin.assert:
        that:
          - rke2_config_stat.stat.mode == '0600'

    - name: Check kubelet drop-in sits next to the RKE2 defaults
      ansible.builtin.find:
        paths: /var/lib/rancher/rke2/agent/etc/kubelet.conf.d
        patterns: "*.conf"
      register: rke2_kubelet_dropins

    - name: Assert both kubelet config files are present
      ansible.builtin.assert:
        that:
          - rke2_kubelet_dropins.files | map(attribute='path') | map('basename') | sort
            == ['00-rke2-defaults.conf', '10-ansible.conf']

    - name: Read effective kubelet configuration (configz)
      ansible.builtin.command:
        cmd: >-
          /var/lib/rancher/rke2/bin/kubectl
          --kubeconfig /etc/rancher/rke2/rke2.yaml
          get --raw /api/v1/nodes/{{ ansible_hostname }}/proxy/configz
      register: rke2_configz
      changed_when: false
      retries: 12
      delay: 10
      until: rke2_configz.rc == 0

    - name: Assert the drop-in is merged over 00-rke2-defaults.conf
      ansible.builtin.assert:
        that:
          - rke2_kubelet_cfg.imageMaximumGCAge == '168h0m0s'
          - rke2_kubelet_cfg.evictionHard['memory.available'] == '123Mi'
          # graceful shutdown fields come from rke2_shutdown_grace_period*
          - rke2_kubelet_cfg.shutdownGracePeriod == '1m30s'
          - rke2_kubelet_cfg.shutdownGracePeriodCriticalPods == '30s'
          # RKE2 default keys survive next to ours: maps merge, not replace
          - rke2_kubelet_cfg.evictionHard['nodefs.available'] is defined
      vars:
        rke2_kubelet_cfg: "{{ (rke2_configz.stdout | from_json).kubeletconfig }}"

    - name: Read the effective logind configuration
      ansible.builtin.command:
        cmd: systemd-analyze cat-config systemd/logind.conf
      register: rke2_logind_effective
      changed_when: false

    # the last occurrence wins; the planted unattended-upgrades file (30)
    # must lose to the role's zz- drop-in
    - name: Assert the role's InhibitDelayMaxSec wins over the distro drop-in
      ansible.builtin.assert:
        that:
          - rke2_logind_effective.stdout_lines
            | select('match', '^InhibitDelayMaxSec=') | list | last == 'InhibitDelayMaxSec=90'
          - "'unattended-upgrades-logind-maxdelay.conf' in rke2_logind_effective.stdout"
        fail_msg: "{{ rke2_logind_effective.stdout_lines | select('search', 'InhibitDelayMaxSec|\\.conf') | list }}"

    - name: Refuse shutdownGracePeriod set directly in rke2_kubelet_config (negative test)
      block:
        - name: Include config tasks with the duplicated field
          ansible.builtin.include_role:
            name: maksimrudakov.rke2.node
            tasks_from: config
          vars:
            rke2_role: server
            rke2_first_server: true
            rke2_no_log: false
            rke2_shutdown_grace_period: 90
            rke2_kubelet_config:
              shutdownGracePeriod: 2m

        - name: Mark unexpected success
          ansible.builtin.set_fact:
            rke2_shutdown_guard_fired: false
      rescue:
        - name: Mark refusal
          ansible.builtin.set_fact:
            rke2_shutdown_guard_fired: true

    - name: Assert the graceful shutdown guard fired
      ansible.builtin.assert:
        that: rke2_shutdown_guard_fired | default(false)

    - name: Check custom manifest applied by RKE2
      ansible.builtin.command:
        cmd: >-
          /var/lib/rancher/rke2/bin/kubectl
          --kubeconfig /etc/rancher/rke2/rke2.yaml
          get configmap molecule-test -n kube-system
          -o jsonpath={.data.source}
      register: rke2_manifest_cm
      changed_when: false
      retries: 12
      delay: 10
      until: rke2_manifest_cm.stdout == 'rke2-manifests'

    - name: Check fleet-controller is rolled out
      ansible.builtin.command:
        cmd: >-
          /var/lib/rancher/rke2/bin/kubectl
          --kubeconfig /etc/rancher/rke2/rke2.yaml
          rollout status deployment/fleet-controller
          -n cattle-fleet-system --timeout=180s
      changed_when: false

    - name: Read the local agent AGENT_SCOPE
      ansible.builtin.command:
        cmd: >-
          /var/lib/rancher/rke2/bin/kubectl
          --kubeconfig /etc/rancher/rke2/rke2.yaml
          get deployment fleet-agent -n cattle-fleet-local-system
          -o 'jsonpath={.spec.template.spec.containers[0].env[?(@.name=="AGENT_SCOPE")].value}'
      register: rke2_fleet_agent_scope
      changed_when: false
      retries: 18
      delay: 10
      until: rke2_fleet_agent_scope.stdout == 'cattle-fleet-local-system'

    - name: Check the local Fleet cluster is registered and ready
      ansible.builtin.command:
        cmd: >-
          /var/lib/rancher/rke2/bin/kubectl
          --kubeconfig /etc/rancher/rke2/rke2.yaml
          get bundle fleet-agent-local -n fleet-local
          -o jsonpath={.status.summary.ready}
      register: rke2_fleet_agent_bundle
      changed_when: false
      retries: 18
      delay: 10
      until: rke2_fleet_agent_bundle.stdout == '1'
