---
# Re-apply tasks_from: config with rke2_step overrides the way reconfig.yml
# does, then assert how many times rke2-server was (re)started (default 1)
- name: "Remember the journal position: {{ rke2_step.name }}"
  ansible.builtin.command:
    cmd: journalctl --show-cursor -n 0 -q
  register: rke2_journal_cursor
  changed_when: false

- name: "Apply config: {{ rke2_step.name }}"
  when: not (rke2_step.plain_restart | default(false))
  ansible.builtin.include_role:
    name: maksimrudakov.rke2.node
    tasks_from: config
  vars:
    rke2_audit_policy: "{{ rke2_step.audit_policy | default(rke2_base.rke2_audit_policy) }}"
    rke2_audit_log_maxage: "{{ rke2_step.audit_log_maxage | default(rke2_base.rke2_audit_log_maxage) }}"
    rke2_pss_config: "{{ rke2_step.pss_config | default(rke2_base.rke2_pss_config) }}"
    rke2_server_files: "{{ rke2_step.server_files | default(rke2_base.rke2_server_files) }}"

- name: "Restart: {{ rke2_step.name }}"
  block:
    - name: "Restart now: {{ rke2_step.name }}"
      ansible.builtin.meta: flush_handlers

    # timeout stops only the client: the systemd job keeps running, so
    # containerd is still alive while the rescue collects diagnostics
    - name: "Restart without changes: {{ rke2_step.name }}"
      ansible.builtin.command:
        cmd: timeout 600 systemctl restart rke2-server
      when: rke2_step.plain_restart | default(false)
      changed_when: true
  rescue:
    - name: "Collect rke2-server diagnostics: {{ rke2_step.name }}"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          crictl() { /var/lib/rancher/rke2/bin/crictl --runtime-endpoint unix:///run/k3s/containerd/containerd.sock "$@"; }
          systemctl status rke2-server --no-pager -l || true
          echo '--- top'
          top -b -n 1 -o %CPU | head -25 || true
          echo '--- journal'
          journalctl -u rke2-server -o short-precise --no-pager -n 200 || true
          echo '--- containers'
          crictl ps -a || true
          # pod logs stay on disk after ExecStopPost kills containerd
          for d in /var/log/pods/kube-system_kube-apiserver-* /var/log/pods/kube-system_etcd-*; do
            for f in $(ls -t "$d"/*/*.log 2>/dev/null | head -3); do
              echo "--- $f"
              tail -n 80 "$f" || true
            done
          done
          echo '--- etcd processes'
          ps -eo pid,ppid,stat,lstart,cmd | grep -E '[e]tcd|[c]ontainerd-shim' || true
          echo '--- etcd db holders'
          # fuser may be missing in the image: scan /proc fds instead
          for fd in /proc/[0-9]*/fd/*; do
            [ "$(readlink "$fd" 2>/dev/null)" = /var/lib/rancher/rke2/server/db/etcd/member/snap/db ] || continue
            p=${fd#/proc/}; p=${p%%/*}
            echo "pid $p: $(tr '\0' ' ' < /proc/$p/cmdline 2>/dev/null)"
          done
          grep -E '^[0-9]+: (POSIX|FLOCK)' /proc/locks || true
          for p in $(pgrep -x etcd); do
            echo "pid $p cgroup: $(cat /proc/$p/cgroup 2>/dev/null | tr '\n' ' ')"
          done
          echo '--- kubelet.log (etcd / kube-apiserver / kill)'
          grep -E 'etcd|kube-apiserver|Killing|probe|SyncLoop (ADD|REMOVE|DELETE)' \
            /var/lib/rancher/rke2/agent/logs/kubelet.log | grep -v 'Error updating node status' | tail -n 150 || true
          echo '--- containerd.log (etcd / kube-apiserver / stop)'
          grep -E 'etcd|kube-apiserver|StopPodSandbox|TaskExit|shim disconnected' \
            /var/lib/rancher/rke2/agent/containerd/containerd.log | tail -n 150 || true
        executable: /bin/bash
      register: rke2_diag
      changed_when: false

    - name: "Show rke2-server diagnostics: {{ rke2_step.name }}"
      ansible.builtin.debug:
        var: rke2_diag.stdout_lines

    - name: "Fail after diagnostics: {{ rke2_step.name }}"
      ansible.builtin.fail:
        msg: "rke2-server restart failed: {{ ansible_failed_result.msg | default('') }}"

- name: "Count rke2-server starts: {{ rke2_step.name }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      journalctl -u rke2-server.service -o cat -q
      --after-cursor='{{ rke2_journal_cursor.stdout | regex_replace('^-- cursor: ', '') }}'
      | grep -cE '^Started (rke2-server|Rancher Kubernetes Engine)' || true
    executable: /bin/bash
  register: rke2_starts
  changed_when: false

- name: "Assert the restart count: {{ rke2_step.name }}"
  ansible.builtin.assert:
    that: rke2_starts.stdout | int == rke2_step.restarts | default(1)
    fail_msg: "rke2-server started {{ rke2_starts.stdout }} times, expected {{ rke2_step.restarts | default(1) }}"

- name: "Wait for the API: {{ rke2_step.name }}"
  ansible.builtin.command:
    cmd: "{{ rke2_kubectl_cmd }} get --raw /readyz"
  register: rke2_readyz
  changed_when: false
  retries: 60
  delay: 5
  until: rke2_readyz.rc == 0
