---
rke2_role: server
rke2_first_server: true
rke2_no_log: false
rke2_sysctl_params: []  # not writable inside a container
rke2_kubelet_config: {}
rke2_audit_log_maxage: 30

rke2_audit_policy:
  apiVersion: audit.k8s.io/v1
  kind: Policy
  omitStages: [RequestReceived]
  rules:
    - level: None
      nonResourceURLs: ["/healthz*", "/readyz*", "/livez*", "/version"]
    - level: Metadata
      resources: [{group: "", resources: [secrets]}]
    - level: None

rke2_pss_config:
  apiVersion: apiserver.config.k8s.io/v1
  kind: AdmissionConfiguration
  plugins:
    - name: PodSecurity
      configuration:
        apiVersion: pod-security.admission.config.k8s.io/v1
        kind: PodSecurityConfiguration
        defaults: {enforce: baseline, audit: restricted, warn: restricted}
        exemptions:
          namespaces: [kube-system]

rke2_server_files:
  - path: /etc/rancher/rke2/molecule/dict.yaml
    content: {kind: Example, spec: {replicas: 1}}
  - path: /etc/rancher/rke2/molecule/raw.txt
    content: |
      raw content v1
    mode: "0640"
