---
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ansible_collections/maksimrudakov/rke2
      - uses: ansible/ansible-lint@262624cd0ab22a4221293216856c59671ce7aa5e # v26.6.0
        with:
          working_directory: ansible_collections/maksimrudakov/rke2

  molecule:
    runs-on: ubuntu-latest
    needs: ansible-lint
    strategy:
      fail-fast: false
      matrix:
        # airgap: fast install-path test with a mock mirror (no real RKE2)
        # default: full single-node RKE2 bootstrap in a privileged container
        # el: RHEL-family install path — install.sh switches to the RPM method
        #     there, which puts the binary outside the tar layout
        scenario: [airgap, default, el]
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ansible_collections/maksimrudakov/rke2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install molecule
        run: pip install "molecule>=25.1" "molecule-plugins[docker]>=23.7" "ansible-core>=2.16"

      - name: Install collections
        run: ansible-galaxy collection install ansible.posix community.docker

      - name: Run molecule
        run: molecule test -s ${{ matrix.scenario }}
        working-directory: ansible_collections/maksimrudakov/rke2
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  build:
    runs-on: ubuntu-latest
    needs: ansible-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install "ansible-core>=2.16"
      - name: Build collection artifact
        run: ansible-galaxy collection build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-tarball
          path: maksimrudakov-rke2-*.tar.gz
          retention-days: 14
