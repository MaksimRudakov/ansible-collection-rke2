---
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: pip install "ansible-core>=2.16"

      - name: Verify galaxy.yml version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version: //p' galaxy.yml)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v${tag} does not match galaxy.yml version ${version}" >&2
            exit 1
          fi

      - name: Build collection artifact
        run: ansible-galaxy collection build

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" maksimrudakov-rke2-*.tar.gz --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Ansible Galaxy (optional)
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [ -z "${GALAXY_API_KEY}" ]; then
            echo "GALAXY_API_KEY is not set — skipping Galaxy publish"
            exit 0
          fi
          ansible-galaxy collection publish maksimrudakov-rke2-*.tar.gz --api-key "${GALAXY_API_KEY}"
