---
# systemd-logind re-reads logind.conf on SIGHUP only since systemd 254;
# older releases (Ubuntu 22.04: 249, EL9: 252, EL8: 239) need a restart.
# Restarting logind on a headless server keeps existing sessions
- name: Detect systemd version
  ansible.builtin.command:
    cmd: systemctl --version
  register: rke2_systemctl_version
  changed_when: false
  check_mode: false

- name: Reload systemd-logind  # noqa: no-handler
  ansible.builtin.command:
    cmd: >-
      {{ 'systemctl kill -s HUP systemd-logind.service'
         if rke2_systemd_version | int >= 254
         else 'systemctl restart systemd-logind.service' }}
  changed_when: true
  vars:
    rke2_systemd_version: >-
      {{ rke2_systemctl_version.stdout_lines[0] | regex_search('systemd (\d+)', '\1') | first }}
