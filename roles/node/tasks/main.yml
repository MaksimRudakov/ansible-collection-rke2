---
- name: Validate rke2_role
  ansible.builtin.assert:
    that:
      - rke2_role is defined
      - rke2_role in ['server', 'agent']
    fail_msg: "rke2_role must be 'server' or 'agent'"

- name: Validate air-gapped configuration
  ansible.builtin.assert:
    that:
      - rke2_mirror_base | length > 0
    fail_msg: "rke2_mirror_base is required when rke2_airgap is true"
  when: rke2_airgap | bool

# Convenience for the collection playbooks: when the inventory follows the
# rke2_servers/rke2_agents contract, joining nodes derive the registration
# URL and fetch the token from the bootstrap host automatically
- name: Derive join parameters
  ansible.builtin.include_tasks: join_params.yml

- name: Include install tasks
  ansible.builtin.include_tasks: install.yml

- name: Include CIS prerequisites
  ansible.builtin.include_tasks: cis.yml
  when: rke2_cis_profile | length > 0

- name: Include config tasks
  ansible.builtin.include_tasks: config.yml

- name: Include first server tasks
  ansible.builtin.include_tasks: first_server.yml
  when:
    - rke2_role == 'server'
    - rke2_first_server | default(false)

- name: Include additional server tasks
  ansible.builtin.include_tasks: additional_server.yml
  when:
    - rke2_role == 'server'
    - not (rke2_first_server | default(false))

- name: Include agent tasks
  ansible.builtin.include_tasks: agent.yml
  when: rke2_role == 'agent'

- name: Apply node-role labels
  ansible.builtin.include_tasks: node_roles.yml
  when: rke2_node_roles | length > 0
