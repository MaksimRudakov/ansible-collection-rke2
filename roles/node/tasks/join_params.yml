---
# Derive registration URL / join token for joining nodes. Included from
# main.yml and from config.yml so that standalone `tasks_from: config`
# (reconfig playbook) renders the same complete config as a full converge —
# without it agent configs lose server:/token: and the service fails with
# "--server is required"
- name: Derive rke2_server_url from the bootstrap host
  ansible.builtin.set_fact:
    rke2_server_url: "https://{{ hostvars[rke2_bootstrap_host].ansible_host | default(rke2_bootstrap_host) }}:9345"
  when:
    - not (rke2_first_server | default(false))
    - rke2_server_url | length == 0
    - rke2_bootstrap_host | length > 0

- name: Fetch join token from the bootstrap host
  ansible.builtin.include_tasks: token.yml
  when:
    - not (rke2_first_server | default(false))
    - rke2_token | length == 0
    - rke2_bootstrap_host | length > 0

- name: Validate required variables for joining nodes
  ansible.builtin.assert:
    that:
      - rke2_server_url | length > 0
      - rke2_token | length > 0
    fail_msg: >-
      rke2_server_url and rke2_token are required for joining nodes.
      Set them explicitly or put control-plane hosts into the
      '{{ rke2_servers_group }}' inventory group for auto-derivation.
  when: not (rke2_first_server | default(false))
