---
- name: Wait for the registration endpoint before joining
  ansible.builtin.include_tasks: wait_server_url.yml

- name: Enable and start rke2-agent
  ansible.builtin.systemd_service:
    name: rke2-agent
    enabled: true
    state: started

- name: Wait for kubelet port
  ansible.builtin.wait_for:
    port: 10250
    timeout: "{{ rke2_kubelet_wait_timeout }}"
